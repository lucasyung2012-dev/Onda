# =============================================================
# Robô de coleta do Onda.
#
# Quando roda:
#   - a cada 3 horas (o horário do "cron" é UTC; o código calcula
#     a data de Brasília sozinho);
#   - quando você aperta "Run workflow" na aba Actions do GitHub;
#   - quando alguém muda o código do coletor ou a lista de fontes.
#
# O que faz: roda coletor/coletar.mjs e guarda as notícias no ramo
# "dados", fora do histórico da main (ver .github/dados.sh).
# =============================================================
name: Coletar notícias

on:
  schedule:
    - cron: '7 */3 * * *'   # minuto 7 de cada 3 horas (evita o horário cheio, mais congestionado)
  workflow_dispatch:         # botão "Run workflow"
  push:
    branches: [main]
    paths:
      - 'coletor/**'
      - 'data/fontes.json'
      - '.github/workflows/coletar.yml'

# Permite que o robô grave os arquivos de volta no repositório.
permissions:
  contents: write

# Nunca roda duas coletas ao mesmo tempo.
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # As notícias dos últimos dias moram no ramo "dados" (ver .github/dados.sh)
      - name: Baixar as notícias guardadas
        run: bash .github/dados.sh baixar

      - name: Coletar as notícias
        run: node coletor/coletar.mjs

      # Dólar, euro, petróleo, Selic e inflação. Se falhar, a coleta segue.
      - name: Atualizar os indicadores
        continue-on-error: true
        run: node coletor/indicadores.mjs

      # Substitui o ramo "dados" (um commit só, sem acumular histórico).
      # A main não recebe commit: assim o repositório não cresce a cada 3 horas.
      - name: Guardar as notícias
        run: |
          git config user.name "onda-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/dados.sh guardar
