# =============================================================
# Analista do Onda: destaque do dia (com mais 5) e tema do dia, com IA.
#
# Roda todo dia às 6h30 de Brasília (9h30 UTC), para estar pronto ~7h, e pelo botão
# "Run workflow". Antes de analisar, faz uma coleta nova.
#
# Precisa de pelo menos uma chave gratuita nos Secrets do repositório
# (Settings → Secrets and variables → Actions → New repository secret):
#   GROQ_API_KEY       (principal)
#   OPENROUTER_API_KEY (reserva, opcional)
# =============================================================
name: Analisar destaque

on:
  schedule:
    - cron: '30 9 * * *'   # 6h30 de Brasília: o destaque e o tema ficam prontos por volta das 7h
  workflow_dispatch:
    inputs:
      parte:
        description: 'O que rodar'
        type: choice
        default: tudo
        options: [tudo, 'só o tema do dia', 'só traduzir', 'refazer o destaque', 'testar o aviso', 'só o holograma']

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Baixar as notícias guardadas
        run: bash .github/dados.sh baixar

      # O destaque e o tema de hoje para o app são montados a partir do arquivo
      # do dia (não ficam duplicados no repositório; ver coletor/montar-app.mjs).
      - name: Montar os arquivos do app
        continue-on-error: true
        run: node coletor/montar-app.mjs

      - name: Coletar as notícias mais recentes
        run: node coletor/coletar.mjs

      - name: Escolher e analisar o destaque do dia
        if: github.event.inputs.parte != 'só o tema do dia' && github.event.inputs.parte != 'só traduzir' && github.event.inputs.parte != 'testar o aviso' && github.event.inputs.parte != 'só o holograma'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REFAZER_DESTAQUE: ${{ github.event.inputs.parte == 'refazer o destaque' && 'sim' || 'nao' }}
        run: node coletor/analisar.mjs

      # Roda mesmo se o destaque falhar. O "sleep" respeita o limite
      # de uso por minuto do plano gratuito da IA.
      - name: Escrever o tema do dia
        if: always() && github.event.inputs.parte != 'só traduzir' && github.event.inputs.parte != 'refazer o destaque' && github.event.inputs.parte != 'testar o aviso' && github.event.inputs.parte != 'só o holograma'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.parte }}" != "só o tema do dia" ]; then sleep 65; fi
          node coletor/tema.mjs

      # O "holograma": mapas do lugar do fato (mundo, país e região).
      # Se falhar, o destaque e o tema saem do mesmo jeito, sem mapa.
      - name: Desenhar o holograma
        if: always() && github.event.inputs.parte != 'testar o aviso' && github.event.inputs.parte != 'só traduzir'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npm install --no-save --no-package-lock d3-geo@3 topojson-client@3 topojson-simplify@3 world-atlas@2
          node coletor/holograma.mjs

      # Versão em inglês da análise e do tema (para o app no idioma inglês)
      - name: Traduzir para o inglês
        if: always() && github.event.inputs.parte != 'testar o aviso' && github.event.inputs.parte != 'só o holograma'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.parte }}" != "só traduzir" ]; then sleep 65; fi
          node coletor/traduzir.mjs

      # Aviso no celular: "o destaque do dia chegou" (uma vez por dia)
      - name: Avisar no celular
        if: always() && (github.event_name == 'schedule' || github.event.inputs.parte == 'tudo' || github.event.inputs.parte == 'refazer o destaque' || github.event.inputs.parte == 'testar o aviso')
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          FORCAR_AVISO: ${{ github.event.inputs.parte == 'testar o aviso' && 'sim' || 'nao' }}
        run: |
          npm install --no-save --no-package-lock web-push@3
          node coletor/avisos.mjs

      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "onda-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/dados.sh guardar   # notícias e indicadores: ramo "dados"
          # A análise, o tema e as traduções (pequenos, 1 vez por dia) vão para a main.
          git add data/
          if git diff --cached --quiet; then
            echo "Nada de novo para salvar."
          else
            git commit -m "Análise do dia: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') (Brasília)"
            git pull --rebase
            git push
          fi
