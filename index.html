<!doctype html>
<!--
  Onda — do mundo até você.
  Esta é a única página do site. O conteúdo de cada aba é montado pelo
  JavaScript (js/app.js) a partir dos arquivos que os robôs atualizam:
    data/app/analise.json → destaque do dia analisado pela IA
    data/app/hoje.json    → todas as notícias das últimas 24 horas
-->
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Onda</title>
  <meta name="description" content="Onda — do mundo até você. Radar geopolítico pessoal.">

  <!-- App instalável (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#051526">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Onda">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <link rel="icon" href="assets/logo/onda-mini.svg" type="image/svg+xml">

  <!-- Fontes: Fraunces (títulos) e Inter (texto), gratuitas do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/estilo.css">

  <!-- Aplica o tema salvo ANTES de desenhar a página (evita piscar). -->
  <script>
    try {
      const salvo = localStorage.getItem('onda-tema');
      const prefereClaro = matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.tema = salvo || (prefereClaro ? 'claro' : 'escuro');
    } catch (e) { /* sem armazenamento: fica no escuro */ }
  </script>
</head>
<body>
  <header class="topo">
    <a class="marca" href="#hoje" aria-label="Onda — ir para Hoje">
      <img src="assets/logo/onda-mini.svg" alt="">
      <span><strong>Onda</strong><small>do mundo até você</small></span>
    </a>
    <div class="topo-acoes">
      <button id="botao-tema" class="botao-icone" type="button" aria-label="Alternar modo noite e dia"></button>
    </div>
  </header>

  <!-- Cada aba desenha o seu conteúdo aqui -->
  <main id="conteudo" tabindex="-1">
    <p class="carregando">Carregando o radar…</p>
  </main>

  <!-- Folha da notícia: sobe de baixo no celular, vem da direita no iPad -->
  <div id="veu" class="veu" hidden></div>
  <section id="folha" class="folha" role="dialog" aria-modal="true" aria-label="Notícia" hidden>
    <div class="folha-pega" data-arrastar><i></i></div>
    <div class="folha-topo" data-arrastar>
      <span class="rotulo" id="folha-rotulo">Notícia</span>
      <button class="botao-icone i-fechar" type="button" data-fechar-folha aria-label="Fechar" style="--icone:var(--i-fechar)"></button>
    </div>
    <div class="folha-corpo" id="folha-corpo"></div>
  </section>

  <!-- Abas: no rodapé do celular, na lateral do iPad -->
  <nav class="abas" aria-label="Seções">
    <a href="#hoje" data-aba="hoje"><span class="icone i-radar" aria-hidden="true"></span>Hoje</a>
    <a href="#temas" data-aba="temas"><span class="icone i-temas" aria-hidden="true"></span>Temas</a>
    <a href="#explorar" data-aba="explorar"><span class="icone i-explorar" aria-hidden="true"></span>Explorar</a>
    <a href="#meu" data-aba="meu"><span class="icone i-pessoa" aria-hidden="true"></span>Meu Onda</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
